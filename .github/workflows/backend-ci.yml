name: backend-ci

# CI do backend (Go). Reproduz o que o deploy.sh faz na VM e o que a VM não faz:
#   build  — cross-compile igual ao workers.Dockerfile (CLAUDE.md 6.1), go vet,
#            todo cmd/* no Dockerfile (6.7), diretiva go <= imagem (6.2)
#   test   — Postgres 16 limpo + migrations (golang-migrate, mesma versão do
#            compose) + go test com cobertura; no master, manda pro SonarCloud
#            analisando o ESPELHO PÚBLICO (o código que o Sonar mostra é o
#            higienizado — o projeto do Sonar é público)
#
# No master roda em TODO push (sem filtro de path): o deploy-backend.yml só
# libera publicar um SHA que tenha este workflow verde.
# Doc: docs/operations/ci-cd.md

on:
  push:
    branches: [master]
  pull_request:
    # só PR que entra no master. Sem isto, o PR #10 (master → n1-base) fazia
    # todo push no master rodar o CI 2× (push + pull_request/synchronize).
    branches: [master]
    paths:
      - 'workers/**'
      - 'migrations/**'
      - 'infra/docker/Dockerfiles/workers.Dockerfile'
      - 'scripts/ci/**'
      - 'scripts/mirror/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  build:
    name: build (linux) + vet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: workers/go.mod
          cache-dependency-path: workers/go.sum

      - name: go.mod/go.sum consistentes (o Dockerfile faz go mod download)
        working-directory: workers
        run: go mod download && go mod verify

      - name: cross-compile igual ao workers.Dockerfile
        working-directory: workers
        run: CGO_ENABLED=0 GOOS=linux go build ./...

      - name: go vet (compila os testes também)
        working-directory: workers
        run: go vet ./...

      - name: todo cmd/* está no workers.Dockerfile (CLAUDE.md 6.7)
        run: bash scripts/ci/check-dockerfile-cmds.sh

      - name: diretiva go <= imagem do builder (CLAUDE.md 6.2)
        run: bash scripts/ci/check-go-version.sh

  test:
    name: test (Postgres 16 + migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: radiocheck
          POSTGRES_PASSWORD: radiocheck
          POSTGRES_DB: radiocheck_tmpl   # banco-MODELO: cada pacote de teste ganha um clone
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U radiocheck -d radiocheck_tmpl"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PG_URL_BASE: postgres://radiocheck:radiocheck@localhost:5432
      TEMPLATE_DB: radiocheck_tmpl
      # o `if` de um step não vê secrets nem o env do próprio step: expõe só SE existe
      SONAR_ATIVO: ${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.SONAR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # o espelho (pra Sonar) é derivado do histórico inteiro do master

      - uses: actions/setup-go@v6
        with:
          go-version-file: workers/go.mod
          cache-dependency-path: workers/go.sum

      # banco descartável: durabilidade não importa, velocidade sim. Os testes do
      # MCP fazem TRUNCATE ... CASCADE a cada teste (centenas de arquivos por vez)
      # e cada pacote ganha um CREATE DATABASE — com fsync isso dominava o tempo.
      - name: Postgres do CI sem fsync (só aqui; NUNCA em prod)
        run: |
          docker run --rm --network host postgres:16-alpine \
            psql "$PG_URL_BASE/$TEMPLATE_DB" -v ON_ERROR_STOP=1 -q \
              -c "ALTER SYSTEM SET fsync = off" \
              -c "ALTER SYSTEM SET synchronous_commit = off" \
              -c "ALTER SYSTEM SET full_page_writes = off" \
              -c "SELECT pg_reload_conf()"

      - name: banco-modelo — migrations (mesma imagem do service migrate do compose)
        run: |
          docker run --rm --network host -v "$PWD/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 -path=/migrations \
            -database "$PG_URL_BASE/$TEMPLATE_DB?sslmode=disable" up

      # as migrations só criam partição do mês corrente pra frente; os testes
      # inserem datas fixas (jun/2026). Ver o cabeçalho do .sql.
      - name: banco-modelo — partições dos meses passados que os testes usam
        run: |
          docker run --rm --network host -v "$PWD/scripts/ci:/sql:ro" postgres:16-alpine \
            psql "$PG_URL_BASE/$TEMPLATE_DB" -v ON_ERROR_STOP=1 -q -f /sql/test-db-partitions.sql

      # um banco clonado do modelo POR PACOTE: sem isso os pacotes se sujam, a
      # guarda do dbtest recusa os últimos e era preciso -p 1 (ver o script)
      - name: go test (banco isolado por pacote)
        env:
          PARALELO: '3'
          COVER_OUT: ${{ github.workspace }}/workers/coverage.out
        run: bash scripts/ci/go-test-isolado.sh

      # ── frontend: testes unitários (Vitest + Testing Library) com cobertura ──
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: frontend — vitest + cobertura
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx vitest run --coverage

      # ── SonarCloud (só master): analisa o espelho público com a cobertura daqui ──
      - name: gerar o espelho público (o que o Sonar vai ver)
        if: env.SONAR_ATIVO == 'true'
        run: |
          python3 -m pip install --quiet --user --break-system-packages git-filter-repo==2.47.0
          python3 -X utf8 scripts/mirror/build_mirror.py --source . --out "$RUNNER_TEMP/espelho"
          # a cobertura usa caminho de módulo (radiocheck/...): vale igual no espelho,
          # que tem as mesmas linhas (as substituições não criam nem removem linha)
          cp workers/coverage.out "$RUNNER_TEMP/espelho/workers/coverage.out"
          # lcov do vitest usa caminho relativo a frontend/ (SF:src/...); o Sonar
          # resolve a partir da raiz do espelho → prefixa frontend/
          sed 's#^SF:src/#SF:frontend/src/#' frontend/coverage/lcov.info > "$RUNNER_TEMP/espelho/frontend-lcov.info"

      # Supressões (sonar.issue.ignore.multicriteria) — SÓ falsos positivos
      # conferidos linha a linha em 2026-11-24; o que é endurecimento real
      # (PATH do ffmpeg, Dockerfile como root/sem lock, http) fica VISÍVEL:
      #   e1 javascript:S2871 hooks.js — sort() de listas de UUID (texto) só pra
      #      montar chave de cache; a ordem padrão é exatamente a desejada
      #   e2 javascript:S2189 dates.js — o laço muta `cur` via setDate(); trocar
      #      por aritmética de ms quebraria na virada de horário de verão
      #   e3 plsql:DeleteOrUpdateWithoutWhereCheck migrations/** — reset de tabela
      #      de propósito em migration de schema (0019, 0025), comentado no SQL
      #   e4 javascript:S6544 ConfirmModal.jsx — window.alert customizado devolve
      #      Promise de propósito (alert assíncrono com modal)
      #   e5 shell:S4790 backup.sh — md5 só pra registrar o dump no log
      #   e6/e7 gosecurity:S2083 materials.go/commercials.go e e8 S6350 — o fluxo
      #      que o Sonar mostra parte do CONTEÚDO do upload → SHA-256 em hex →
      #      nome do arquivo; hex não forma "../". A extensão é literal
      #      (handlers/audio_ext.go) e o resto do caminho é MastersPath + uuid.
      #      Coberto por TestUpload_RecusaExtensaoForaDaLista
      # sources e tests apontam pro repo inteiro: os padrões de teste vão em
      # test.inclusions E em exclusions, senão o Sonar conta teste como código
      # (1ª análise: Go com 118k linhas = produção + testes). Cobertura coletada:
      # Go (workers/coverage.out) e frontend (lcov do vitest); o resto (Python,
      # infra, scripts, migrations) fica fora da conta de cobertura.
      - name: SonarCloud
        if: env.SONAR_ATIVO == 'true'
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: ${{ runner.temp }}/espelho
          args: >
            "-Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}"
            "-Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}"
            "-Dsonar.sources=."
            "-Dsonar.tests=."
            "-Dsonar.test.inclusions=**/*_test.go,**/*.test.mjs,**/*.test.js,frontend/e2e/**,fingerprint/tests/**"
            "-Dsonar.exclusions=**/*_test.go,**/*.test.mjs,**/*.test.js,frontend/e2e/**,fingerprint/tests/**,**/testdata/**,**/node_modules/**,**/*.csv,frontend/public/**"
            "-Dsonar.coverage.exclusions=fingerprint/**,clap-verifier/**,infra/**,scripts/**,migrations/**"
            "-Dsonar.go.coverage.reportPaths=workers/coverage.out"
            "-Dsonar.javascript.lcov.reportPaths=frontend-lcov.info"
            "-Dsonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8"
            "-Dsonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S2871"
            "-Dsonar.issue.ignore.multicriteria.e1.resourceKey=frontend/src/api/hooks.js"
            "-Dsonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S2189"
            "-Dsonar.issue.ignore.multicriteria.e2.resourceKey=frontend/src/utils/dates.js"
            "-Dsonar.issue.ignore.multicriteria.e3.ruleKey=plsql:DeleteOrUpdateWithoutWhereCheck"
            "-Dsonar.issue.ignore.multicriteria.e3.resourceKey=migrations/**"
            "-Dsonar.issue.ignore.multicriteria.e4.ruleKey=javascript:S6544"
            "-Dsonar.issue.ignore.multicriteria.e4.resourceKey=frontend/src/components/ConfirmModal.jsx"
            "-Dsonar.issue.ignore.multicriteria.e5.ruleKey=shell:S4790"
            "-Dsonar.issue.ignore.multicriteria.e5.resourceKey=infra/scripts/backup.sh"
            "-Dsonar.issue.ignore.multicriteria.e6.ruleKey=gosecurity:S2083"
            "-Dsonar.issue.ignore.multicriteria.e6.resourceKey=workers/internal/api/handlers/materials.go"
            "-Dsonar.issue.ignore.multicriteria.e7.ruleKey=gosecurity:S2083"
            "-Dsonar.issue.ignore.multicriteria.e7.resourceKey=workers/internal/api/handlers/commercials.go"
            "-Dsonar.issue.ignore.multicriteria.e8.ruleKey=gosecurity:S6350"
            "-Dsonar.issue.ignore.multicriteria.e8.resourceKey=workers/internal/api/handlers/commercials.go"
