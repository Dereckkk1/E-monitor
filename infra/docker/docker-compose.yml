services:
  postgres:
    image: postgres:16-alpine
    # Tuning parametrizado por env — defaults = valores de fábrica do PG 16
    # (no-op em dev). Prod seta no .env da VM (ver docs/operations/deploy.md):
    #   PG_SHARED_BUFFERS=3GB  PG_EFFECTIVE_CACHE_SIZE=8GB  PG_WORK_MEM=32MB
    #   PG_MAINTENANCE_WORK_MEM=512MB  PG_MAX_WAL_SIZE=4GB
    # random_page_cost=1.1 é default aqui MESMO em dev: todo ambiente roda SSD,
    # e 4.0 (default do PG) faz o planner fugir de index scan.
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-128MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-4GB}
      - -c
      - work_mem=${PG_WORK_MEM:-4MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-64MB}
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - max_wal_size=${PG_MAX_WAL_SIZE:-1GB}
      - -c
      - checkpoint_completion_target=0.9
    # Sem hard limit em dev (0 = ilimitado). Prod (VM c3-highcpu-8, 16GB RAM):
    # PG_MEM_RESERVATION=3g PG_MEM_LIMIT=6g — protege o postgres do OOM killer
    # quando outro service (ex: api com N ffmpeg) pressiona a RAM da VM.
    mem_reservation: ${PG_MEM_RESERVATION:-256m}
    mem_limit: ${PG_MEM_LIMIT:-0}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # WAL archiving (§14.4) is enabled in production via postgresql.conf
      # snippet at infra/postgres/postgresql.conf.snippet — left disabled in
      # local dev to avoid forcing AWS credentials on every contributor.
    volumes:
      # PGDATA_HOST_PATH: defina no .env para um path absoluto do host
      # (ex: /srv/radiocheck/postgres-data) — o postgres passa a usar bind
      # mount, e o dado sobrevive a `docker compose down -v` / `--force-recreate`
      # (causa do incidente 2026-05-12). Sem o env var, cai no volume nomeado
      # `pgdata` (comportamento legado, OK pra dev local).
      # Procedimento de migração: docs/data-durability.md.
      - ${PGDATA_HOST_PATH:-pgdata}:/var/lib/postgresql/data
      - pg_archive:/var/lib/postgresql/archive
      - ../../migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["--jetstream", "--http_port", "8222"]
    ports:
      - "${NATS_PORT}:4222"
      - "8222:8222"

  # ── Migration runner (golang-migrate) ────────────────────────────────────
  # Roda automaticamente antes do `api` subir. Lê migrations/*.up.sql em
  # ordem de versão e aplica as pendentes. Tabela `schema_migrations` no
  # Postgres rastreia o estado. Sai com 0 quando tudo aplicado (ou no-op).
  # Para DB existente, rodar `scripts/bootstrap-migrations.sh` UMA VEZ
  # antes do primeiro `up` para popular schema_migrations com a versão
  # atual e evitar re-execução de migrations já aplicadas.
  migrate:
    image: migrate/migrate:v4.17.1
    volumes:
      - ../../migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    # Sem hard limit em dev (0 = ilimitado). Prod: MINIO_MEM_LIMIT=1g.
    mem_limit: ${MINIO_MEM_LIMIT:-0}
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      # MINIODATA_HOST_PATH: idem PGDATA_HOST_PATH — bind mount em prod
      # protege as evidências de detecção contra recreate acidental.
      - ${MINIODATA_HOST_PATH:-miniodata}:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb -p local/${S3_BUCKET} || true;
      "

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfiles/workers.Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      S3_ENDPOINT: http://minio:9000
      # Endpoint baked into presigned URLs that the *browser* will follow.
      # Inside docker compose the API talks to MinIO via the service alias
      # (minio:9000), but a presigned URL with that host fails in the browser
      # because the host is not resolvable from the user's machine.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_REGION: us-east-1
      MASTERS_PATH: /data/masters
      SEGMENTS_PATH: /data/segments
      API_PORT: "8080"
      # Teto soft do heap Go — o GC fica agressivo perto do limite em vez de
      # deixar o kernel OOM-killar o container (que inclui os ffmpeg de captura).
      # "off" (default do runtime) = sem limite; prod seta API_GOMEMLIMIT=6GiB.
      GOMEMLIMIT: ${API_GOMEMLIMIT:-off}
      # Teto do pool de conexoes pgx (API + jobs + reqmetrics compartilham).
      # Default 20; prod: 40 (setar no .env da VM; max_connections do PG e 100).
      DB_MAX_CONNS: ${DB_MAX_CONNS:-20}
      # Shared-hash: score mínimo que qualifica uma janela como compartilhada
      # (internal/sharing). Vazio = default do binário (20). Subido de 5 após o
      # #2 (densidade ~4×) ter elevado o piso de ruído material-vs-material e
      # deixado 65% do catálogo "cego". Tunável sem redeploy: muda no .env,
      # recria o api e re-roda o backfill-shared-hashes.
      # docs/incidents/incident-2026-06-15-shared-hash-density-regression.md
      SHARING_MIN_SCORE: ${SHARING_MIN_SCORE:-}
      # §18.2.2-v2 — reatribuição por cobertura (corte 15s/30s/60s do mesmo
      # cliente). Default false: o audit só MEDE a cobertura (coluna
      # audit_coverage), não muda atribuição. true LIGA a correção: detecção
      # mal-atribuída é re-apontada pro corte que o clipe cobre mais. Tunável
      # sem rebuild — muda no .env, recria o api (--no-deps). Kill switch
      # instantâneo. docs/architecture/version-disambiguation.md §18.2.2-v2
      DISAMBIG_BY_COVERAGE: ${DISAMBIG_BY_COVERAGE:-false}
      # F-119 multi-atribuição: uma tocada conta p/ todas as campanhas que rodam o
      # mesmo áudio na emissora. OFF = 1:1 (idêntico ao pré-F-119). Liga via .env +
      # recreate --no-deps api. docs/features/multi-attribution.md
      MULTI_ATTRIBUTION: ${MULTI_ATTRIBUTION:-false}
      # Emails diários de alerta de campanha (docs/features/campaign-notification-emails.md).
      # Opt-in: só sobe o job quando NOTIFICATIONS_ENABLED=true no .env. Sem
      # SMTP_USER/SMTP_PASS o mailer cai em noop (não envia). Defaults seguros
      # aqui pra não quebrar ambientes que não setam essas vars.
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-false}
      NOTIFICATIONS_BASE_URL: ${NOTIFICATIONS_BASE_URL:-https://e-monitor.online}
      NOTIFICATIONS_SEND_HOUR: ${NOTIFICATIONS_SEND_HOUR:-8}
      NOTIFICATIONS_INTERVAL: ${NOTIFICATIONS_INTERVAL:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      CLAP_VERIFIER_URL: http://clap-verifier:8080
      # Endpoints probados pelo painel /admin/overview (handler
      # system_health.go). Mantém URLs internas — o probe roda dentro
      # da network do compose, não pelo host. Se um dos serviços não
      # subir, o card aparece como "Fora" em vez de "Não usa", o que é
      # o sinal correto pro operador.
      PROMETHEUS_URL: http://prometheus:9090
      GRAFANA_URL: http://grafana:3000
      JAEGER_URL: http://jaeger:16686
      # OpenTelemetry tracing (§15.3). Empty endpoint disables tracing
      # cleanly; pointing at jaeger:4317 lights up the Jaeger UI.
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      OTEL_SERVICE_NAME: radiocheck-api
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      # Sampling ratio: 1.0 = capture every span, 0.05 = capture 5%.
      # Defaults to 0.05 (suficiente para investigar tendências em prod sem
      # saturar Jaeger). Em dev/incident response, suba pra "1.0" temporariamente:
      #   OTEL_TRACES_SAMPLER_ARG=1.0 docker compose up -d --no-deps api
      # Detection records (Postgres) + métricas Prometheus seguem 100% — só
      # spans são amostrados.
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.05}
      # Em PROD: setar RADIOCHECK_ENV=production no .env da VM.
      # Vira o `deployment.environment` resource attribute dos spans OTel e
      # é base pra qualquer guard futuro de "este é prod, não roda comando
      # destrutivo". Default `development` é seguro pra dev local.
      RADIOCHECK_ENV: ${RADIOCHECK_ENV:-development}
      # Auth (§16.1). JWT_SECRET é obrigatório (>= 32 chars).
      # As duas vars de bootstrap são opcionais e idempotentes:
      # se setadas e o admin ainda não existe, é criado no startup.
      JWT_SECRET: ${JWT_SECRET}
      RADIOCHECK_BOOTSTRAP_ADMIN_EMAIL: ${RADIOCHECK_BOOTSTRAP_ADMIN_EMAIL:-}
      RADIOCHECK_BOOTSTRAP_ADMIN_PASSWORD: ${RADIOCHECK_BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "${API_PORT}:8080"
    volumes:
      # MASTERSDATA_HOST_PATH: idem PGDATA_HOST_PATH — bind mount em prod
      # protege os arquivos master (mp3 dos comerciais).
      - ${MASTERSDATA_HOST_PATH:-mastersdata}:/data/masters
      # SEGMENTSDATA_HOST_PATH: idem PGDATA_HOST_PATH — bind mount em prod tira
      # os ~5GB de segmentos de evidência efêmeros do disco de OS (24G) e os
      # joga em /mnt/data (49G). Cleanup usa o MESMO path (ver service abaixo).
      # Migração: docs/operations/segments-disk-migration.md.
      - ${SEGMENTSDATA_HOST_PATH:-segmentsdata}:/data/segments
      - ../../audio-refs:/audio-refs:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      minio:
        condition: service_healthy

  radio-sim:
    image: alpine:3.19
    profiles: ["sim"]
    entrypoint: ["/bin/sh", "-c"]
    command: ["apk add --no-cache ffmpeg >/dev/null && exec /sim/simulate.sh"]
    environment:
      QUALITY: ${SIM_QUALITY:-fm-standard}
      PORT: "8000"
      GAP_SECONDS: ${SIM_GAP_SECONDS:-15}
      MASTERS_DIR: /masters
    ports:
      - "${SIM_PORT:-18000}:8000"
    volumes:
      - ${MASTERSDATA_HOST_PATH:-mastersdata}:/masters:ro
      - ../../scripts/radio-sim:/sim:ro

  fingerprint:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfiles/fingerprint.Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NATS_URL: nats://nats:4222
      MASTERS_PATH: /data/masters
    volumes:
      - ${MASTERSDATA_HOST_PATH:-mastersdata}:/data/masters
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started

  # ── Fase 2: neural verifier sidecar (CLAP) ────────────────────────────────
  clap-verifier:
    build:
      context: ../../clap-verifier
    environment:
      - MOCK_MODE=true
    ports:
      - "8081:8080"
    volumes:
      - clap-models:/models

  # ── F-110: node-exporter pra textfile collector ──────────────────────────
  # Lê arquivos .prom em /textfile (escritos pelo backup.sh via
  # PROM_TEXTFILE_DIR) e expõe como métricas Prometheus. Sem isso, o alerta
  # BackupNotRunning em alerts.yml fica passivo — métrica nunca aparece, alerta
  # nunca dispara. Causa raiz de uma das camadas que falhou em 2026-05-12.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - "--collector.textfile.directory=/textfile"
      # Desabilita coletores pesados/desnecessários — só queremos o textfile
      # pras métricas de backup. Hardware/disk metrics ficam pro GCP nativo.
      - "--collector.disable-defaults"
      - "--collector.textfile"
    volumes:
      - prometheus-textfile:/textfile:ro
    ports:
      - "9100:9100"

  # ── Fase 2: observabilidade (Prometheus + Grafana + Alertmanager) ────────
  prometheus:
    image: prom/prometheus:v2.52.0
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-lifecycle"

  grafana:
    image: grafana/grafana:10.4.2
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - ../grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ../grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ../alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"

  # ── Fase 2: distributed tracing (§15.3) ──────────────────────────────────
  # Jaeger all-in-one (collector + query + UI in a single container). The
  # workers point OTEL_EXPORTER_OTLP_ENDPOINT at jaeger:4317 (OTLP gRPC).
  # The UI is exposed on http://localhost:16686.
  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "4317:4317"   # OTLP gRPC ingest
      - "4318:4318"   # OTLP HTTP ingest (kept enabled for libraries that
                      # only speak HTTP, e.g. browser-based agents).
      - "16686:16686" # Jaeger UI

  # ── Evidence segment cleanup (rolling retention) ─────────────────────────
  # ffmpeg writes ADTS segments to /data/segments/<station>/ continuously;
  # this sidecar deletes files older than the retention window so disk usage
  # stays bounded. 60 minutes is plenty: the longest evidence window we
  # extract is ~3 minutes (60s pre + 60s commercial + 60s post). Cron runs
  # every 5 minutes — the segments are rotated every 30s by ffmpeg, so 5
  # minutes is fine-grained enough to never accumulate noticeable backlog.
  segments-cleanup:
    image: alpine:3.19
    volumes:
      # Mesmo path do service api (named volume em dev, bind /mnt/data em prod).
      - ${SEGMENTSDATA_HOST_PATH:-segmentsdata}:/data/segments
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          find /data/segments -type f -name "*.aac" -mmin +60 -delete 2>/dev/null || true
          find /data/segments -type d -empty -mindepth 1 -delete 2>/dev/null || true
          sleep 300
        done
    restart: unless-stopped

  # ── Fase 2: backup diario do PG ──────────────────────────────────────────
  # Bugs encontrados em 2026-05-12 (incidente perda de pgdata):
  #   1. Entrypoint anterior fazia `sleep 86400` ANTES de rodar o backup —
  #      primeira execução só ocorria 24h após o container subir. Combinado
  #      com restarts frequentes em desenvolvimento, backup nunca rodava.
  #   2. Falta de PG*/R2_* env vars fazia o backup.sh abortar imediatamente
  #      via `: "${PGHOST:?...}"`. O `while true` engolia o erro silenciosamente.
  # Fix: roda backup imediatamente após subida + plumbar todos env vars que
  # o script exige. AWS CLI agora instalado via `apk add aws-cli` no entrypoint.
  backup:
    image: postgres:16-alpine
    environment:
      # Para pg_basebackup (script lê esses individualmente).
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      BACKUP_DIR: /backup
      # R2 destination (Cloudflare object storage).
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_BUCKET: ${R2_BUCKET}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      LOCAL_RETENTION_DAYS: "${BACKUP_LOCAL_RETENTION_DAYS:-7}"
      # Textfile collector (F-110): script escreve métricas .prom aqui,
      # node-exporter expõe pra Prometheus, alerta dispara se ficar stale.
      PROM_TEXTFILE_DIR: /textfile
    volumes:
      - backup-data:/backup
      - pg_archive:/var/lib/postgresql/archive:ro
      - ../scripts/backup.sh:/backup.sh:ro
      - prometheus-textfile:/textfile
    # Roda o backup imediatamente após o postgres ficar pronto, depois espera
    # 24h pro próximo ciclo. apk add aws-cli porque o script usa `aws s3 cp`
    # para fazer upload pro R2 e a imagem postgres:16-alpine não vem com ele.
    entrypoint:
      - sh
      - -c
      - |
        set -e
        apk add --no-cache aws-cli >/dev/null 2>&1
        echo "[backup] container ready — running first backup now"
        while true; do
          sh /backup.sh || echo "[backup] script exited non-zero — see log above"
          echo "[backup] sleeping 24h until next run"
          sleep 86400
        done
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  pg_archive:
  miniodata:
  mastersdata:
  segmentsdata:
  clap-models:
  grafana-data:
  backup-data:
  prometheus-textfile:
