global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: radiocheck_api
    static_configs:
      - targets: ["api:8080"]

  # F-110: node-exporter expõe as métricas escritas pelo backup.sh via
  # textfile collector (ver infra/prometheus/textfile-collector/README.md).
  # Habilita os alertas BackupNotRunning e RestoreTestFailed.
  - job_name: node_exporter
    static_configs:
      - targets: ["node-exporter:9100"]

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
