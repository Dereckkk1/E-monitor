global:
  resolve_timeout: 5m

route:
  receiver: slack-default
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: slack-default
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL}"
        channel: "#alertas-radiocheck"
        text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}"
