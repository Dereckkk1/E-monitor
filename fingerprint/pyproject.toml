[project]
name = "radiocheck-fingerprint"
version = "0.1.0"
description = "Fingerprint generation service for Radiocheck"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "asyncpg>=0.29",
    "nats-py>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
