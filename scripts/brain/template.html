<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RADIOCHECK · Docs-Brain</title>
<style>
  /* ─────────────────────────────────────────────────────────────────────────
     STARK HUD — Layer 1 (holographic command deck, structural foundation)
     Deep-space OLED base, hairline glass chrome, mono technical readouts.
     Glow / bloom / pulse / aurora / particles arrive in Layers 2–3; the draw
     pipeline and node model below are structured so they layer on cleanly.
     ───────────────────────────────────────────────────────────────────────── */
  :root{
    --bg:#05060A; --panel:rgba(14,18,28,.72); --hair:rgba(120,170,255,.14);
    --hair-strong:rgba(120,170,255,.28);
    --ink:#EAF2FF; --ink-dim:#8CA0C0; --ink-faint:#7080A0;
    --accent:#38E1FF; --accent-2:#FFB84D;
    --radius:14px; --mono:ui-monospace,"JetBrains Mono","Cascadia Code",Consolas,monospace;
    --grot:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
    --ease:cubic-bezier(.32,.72,0,1);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--grot);
    overflow:hidden;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  /* ── ambient backdrop (behind the graph): aurora → vignette → particles ──── */
  /* Aurora / nebula — arc-reactor cyan + amber orbs slowly drifting over deep
     space. Low opacity so it never washes out the nodes. Drift is pure CSS. */
  #aurora{
    position:fixed; inset:-25%; z-index:0; pointer-events:none;
    background:
      radial-gradient(38% 42% at 26% 32%, rgba(56,225,255,.11), transparent 62%),
      radial-gradient(34% 38% at 76% 60%, rgba(255,184,77,.075), transparent 62%),
      radial-gradient(44% 46% at 58% 18%, rgba(56,225,255,.06), transparent 60%),
      radial-gradient(40% 40% at 82% 26%, rgba(120,170,255,.05), transparent 60%);
    background-repeat:no-repeat;
    animation:aurora-drift 46s ease-in-out infinite alternate;
    will-change:transform;
  }
  @keyframes aurora-drift{
    0%{ transform:translate3d(-1.5%,-1%,0) scale(1); }
    50%{ transform:translate3d(2%,1.5%,0) scale(1.06); }
    100%{ transform:translate3d(-1%,2%,0) scale(1.02); }
  }
  /* static edge vignette — deep-space falloff framing the aurora */
  #vignette{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(135% 115% at 50% 42%, transparent 50%, rgba(3,4,7,.55) 78%, rgba(2,3,6,.92) 100%),
      radial-gradient(120% 90% at 50% 6%, rgba(56,225,255,.04), transparent 44%);
  }
  /* thin drifting particle field — its own light canvas behind the graph */
  #particles{ position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }
  /* fixed film grain — pointer-events none, above graph, below chrome */
  #grain{
    position:fixed; inset:0; z-index:70; pointer-events:none; opacity:.05;
    mix-blend-mode:soft-light;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
  }
  /* corner registration marks — precision motif that coheres with glass */
  #marks{ position:fixed; inset:0; z-index:70; pointer-events:none; }
  #marks i{ position:absolute; width:14px; height:14px; opacity:.5; }
  #marks i::before,#marks i::after{ content:""; position:absolute; background:var(--hair-strong); }
  #marks i::before{ width:14px; height:1px; top:0; }
  #marks i::after{ height:14px; width:1px; left:0; }
  #marks .tl{ top:14px; left:14px; }
  #marks .tr{ top:14px; right:14px; transform:scaleX(-1); }
  #marks .bl{ bottom:14px; left:14px; transform:scaleY(-1); }
  #marks .br{ bottom:14px; right:14px; transform:scale(-1,-1); }
  /* fine crosshair "+" registration marks at a sparse interior grid (cyan, faint) */
  #marks b{ position:absolute; width:11px; height:11px; opacity:.4; }
  #marks b::before,#marks b::after{ content:""; position:absolute; background:var(--accent); }
  #marks b::before{ left:5px; top:0; width:1px; height:11px; }
  #marks b::after{ top:5px; left:0; height:1px; width:11px; }
  #marks b.c1{ left:20%; top:23%; } #marks b.c2{ left:80%; top:23%; }
  #marks b.c3{ left:20%; bottom:23%; } #marks b.c4{ left:80%; bottom:23%; }

  /* honest static build/unit tag (no fake precision numbers) */
  #unit{
    position:fixed; z-index:70; right:18px; bottom:15px; pointer-events:none;
    font-family:var(--mono); font-size:9px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--ink-faint); opacity:.75;
  }

  #app{ position:fixed; inset:0; }

  /* ── canvas graph ──────────────────────────────────────────────────────── */
  #graph{ position:fixed; inset:0; width:100%; height:100%; z-index:1; display:block; background:transparent; touch-action:none; cursor:grab; }
  #graph.dragging{ cursor:grabbing; }

  /* ── top HUD bar ───────────────────────────────────────────────────────── */
  #hud-top{
    position:fixed; top:0; left:0; right:0; z-index:100;
    display:grid; grid-template-columns:1fr minmax(180px,440px) 1fr;
    align-items:center; gap:18px;
    padding:14px 20px;
    background:linear-gradient(180deg, rgba(6,8,14,.86), rgba(6,8,14,.30) 80%, transparent);
    border-bottom:1px solid var(--hair);
    backdrop-filter:blur(14px) saturate(1.15);
    -webkit-backdrop-filter:blur(14px) saturate(1.15);
  }
  .brand{
    font-family:var(--grot); font-weight:600; font-size:15px;
    letter-spacing:.24em; text-transform:uppercase; white-space:nowrap;
    color:var(--ink); display:flex; align-items:center; gap:10px;
  }
  .brand::before{
    content:""; width:9px; height:9px; border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 10px var(--accent), 0 0 3px #fff inset;
  }
  .brand .dim{ color:var(--ink-faint); font-weight:500; letter-spacing:.18em; }

  #search{
    font-family:var(--mono); font-size:12.5px; letter-spacing:.08em; color:var(--ink);
    background:rgba(9,12,20,.7); border:1px solid var(--hair);
    border-radius:999px; padding:9px 16px 9px 38px; width:100%;
    outline:none; transition:border-color .3s var(--ease), box-shadow .3s var(--ease), background .3s var(--ease);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 16 16' fill='none' stroke='%238CA0C0' stroke-width='1.3'><circle cx='7' cy='7' r='5'/><path d='M11 11l3.5 3.5'/></svg>");
    background-repeat:no-repeat; background-position:14px 50%;
  }
  #search::placeholder{ color:var(--ink-faint); letter-spacing:.14em; text-transform:uppercase; font-size:11px; }
  #search:focus{
    border-color:var(--hair-strong);
    box-shadow:0 0 0 1px rgba(56,225,255,.25), 0 0 22px rgba(56,225,255,.14);
    background-color:rgba(11,16,26,.9);
  }
  #telemetry{
    font-size:11px; letter-spacing:.14em; color:var(--ink-dim);
    text-align:right; white-space:nowrap; justify-self:end;
    text-transform:uppercase; overflow:hidden; text-overflow:ellipsis; max-width:100%;
  }
  #telemetry b{ color:var(--accent); font-weight:600; }
  #telemetry .amber{ color:var(--accent-2); }
  #telemetry::before{ content:"[\00a0"; color:var(--ink-faint); }
  #telemetry::after{ content:"\00a0]"; color:var(--ink-faint); }

  .mono{ font-family:var(--mono); }

  /* ── readout panel — double-bezel glass ────────────────────────────────── */
  #readout{
    position:fixed; z-index:95; top:74px; right:16px; bottom:96px; width:min(374px,calc(100vw - 32px));
    background:var(--panel); border:1px solid var(--hair); border-radius:18px;
    padding:6px;
    backdrop-filter:blur(20px) saturate(1.25); -webkit-backdrop-filter:blur(20px) saturate(1.25);
    box-shadow:0 24px 70px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.3);
    opacity:0; transform:translateX(18px) scale(.99);
    transition:opacity .34s var(--ease), transform .34s var(--ease);
    will-change:transform,opacity;
  }
  #readout.open{ opacity:1; transform:none; }
  #readout[hidden]{ display:none; }
  /* corner registration ticks — instrument framing that coheres with glass */
  #readout::before, #readout::after{
    content:""; position:absolute; width:13px; height:13px; z-index:3; pointer-events:none;
    border:1.5px solid var(--accent); opacity:.5;
  }
  #readout::before{ top:9px; left:9px; border-right:none; border-bottom:none; }
  #readout::after{ bottom:9px; right:9px; border-left:none; border-top:none; }
  .rd-core{
    position:relative; height:100%; overflow-y:auto; overflow-x:hidden;
    background:linear-gradient(180deg, rgba(10,14,22,.72), rgba(7,9,15,.66));
    border:1px solid var(--hair); border-radius:13px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07), inset 0 0 40px rgba(56,225,255,.03);
    padding:18px 18px 22px;
    scrollbar-width:thin; scrollbar-color:var(--hair-strong) transparent;
  }
  .rd-core::-webkit-scrollbar{ width:8px; }
  .rd-core::-webkit-scrollbar-thumb{ background:var(--hair-strong); border-radius:8px; }
  .rd-close{
    position:absolute; top:12px; right:12px; width:28px; height:28px;
    display:grid; place-items:center; cursor:pointer;
    background:rgba(255,255,255,.04); border:1px solid var(--hair); border-radius:8px;
    color:var(--ink-dim); font-size:15px; line-height:1;
    transition:color .25s var(--ease), border-color .25s var(--ease), background .25s var(--ease), transform .2s var(--ease);
  }
  .rd-close:hover{ color:var(--ink); border-color:var(--hair-strong); background:rgba(255,255,255,.08); }
  .rd-close:active{ transform:scale(.94); }
  .rd-eyebrow{
    font-family:var(--mono); font-size:10px; letter-spacing:.24em; text-transform:uppercase;
    color:var(--ink-faint); margin:0 0 8px;
  }
  .rd-title{
    font-family:var(--grot); font-weight:600; font-size:19px; line-height:1.22;
    letter-spacing:-.01em; margin:0 34px 14px 0; color:var(--ink);
  }
  .rd-meta{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px; }
  .chip{
    font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase;
    display:inline-flex; align-items:center; gap:6px;
    padding:4px 9px; border-radius:7px;
    border:1px solid var(--hair); background:rgba(255,255,255,.03); color:var(--ink-dim);
  }
  .chip .dot{ width:8px; height:8px; border-radius:50%; box-shadow:0 0 7px currentColor; }
  .rd-section{ margin-top:18px; }
  .rd-section > h4{
    font-family:var(--mono); font-size:10px; letter-spacing:.22em; text-transform:uppercase;
    color:var(--accent); margin:0 0 10px; font-weight:600;
    display:flex; align-items:center; gap:8px;
  }
  .rd-section > h4::after{ content:""; flex:1; height:1px; background:var(--hair); }
  .rd-summary{ font-size:13.5px; line-height:1.62; color:var(--ink-dim); margin:0; }
  .rd-code{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:5px; }
  .rd-code a{
    font-family:var(--mono); font-size:11.5px; color:var(--ink-dim); text-decoration:none;
    padding:6px 9px; border-radius:7px; border:1px solid transparent;
    background:rgba(255,255,255,.02); word-break:break-all;
    transition:color .2s var(--ease), border-color .2s var(--ease), background .2s var(--ease);
  }
  .rd-code a::before{ content:"› "; color:var(--accent-2); }
  .rd-code a:hover{ color:var(--ink); border-color:var(--hair); background:rgba(255,184,77,.06); }
  .rd-links{ display:flex; flex-direction:column; gap:6px; }
  .linkbtn{
    display:flex; align-items:center; gap:9px; width:100%; text-align:left; cursor:pointer;
    font-family:var(--grot); font-size:12.5px; color:var(--ink-dim);
    background:rgba(255,255,255,.02); border:1px solid var(--hair); border-radius:9px;
    padding:8px 11px;
    transition:color .22s var(--ease), border-color .22s var(--ease), background .22s var(--ease), transform .18s var(--ease);
  }
  .linkbtn:hover{ color:var(--ink); border-color:var(--hair-strong); background:rgba(56,225,255,.06); transform:translateX(2px); }
  .linkbtn:active{ transform:translateX(0) scale(.99); }
  .linkbtn .dot{ width:8px; height:8px; border-radius:50%; flex:none; box-shadow:0 0 7px currentColor; }
  .linkbtn .lb-title{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rd-empty{ font-family:var(--mono); font-size:11px; letter-spacing:.06em; color:var(--ink-faint); }
  .rd-stats{ display:flex; gap:18px; margin-top:20px; padding-top:14px; border-top:1px solid var(--hair); }
  .rd-stat{ font-family:var(--mono); }
  .rd-stat .k{ font-size:9.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-faint); display:block; }
  .rd-stat .v{ font-size:17px; color:var(--ink); font-weight:600; }

  /* ── legend / footer ───────────────────────────────────────────────────── */
  #legend{
    position:fixed; z-index:90; left:16px; bottom:16px; max-width:min(560px,calc(100vw - 32px));
    background:var(--panel); border:1px solid var(--hair); border-radius:14px;
    backdrop-filter:blur(16px) saturate(1.2); -webkit-backdrop-filter:blur(16px) saturate(1.2);
    box-shadow:0 16px 44px rgba(0,0,0,.5);
    padding:11px 13px;
  }
  .lg-head{ display:flex; align-items:center; gap:10px; margin-bottom:9px; }
  .lg-toggle{
    font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; cursor:pointer;
    color:var(--ink-dim); background:rgba(255,255,255,.03); border:1px solid var(--hair);
    border-radius:8px; padding:5px 10px;
    display:inline-flex; align-items:center; gap:7px;
    transition:color .25s var(--ease), border-color .25s var(--ease), background .25s var(--ease);
  }
  .lg-toggle:hover{ color:var(--ink); border-color:var(--hair-strong); }
  .lg-toggle b{ color:var(--accent); font-weight:600; }
  .lg-hint{ font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; color:var(--ink-faint); text-transform:uppercase; }
  .lg-items{ display:flex; flex-wrap:wrap; gap:4px 14px; }
  .lg-item{
    display:inline-flex; align-items:center; gap:7px; cursor:pointer;
    font-family:var(--mono); font-size:11px; letter-spacing:.03em; color:var(--ink-dim);
    padding:3px 6px; border-radius:6px; border:1px solid transparent;
    transition:color .2s var(--ease), background .2s var(--ease), border-color .2s var(--ease), opacity .2s var(--ease);
  }
  .lg-item:hover{ color:var(--ink); background:rgba(255,255,255,.04); }
  .lg-item.active{ color:var(--ink); border-color:var(--hair-strong); background:rgba(56,225,255,.08); }
  .lg-item.muted{ opacity:.4; }
  .lg-item .sw{ width:10px; height:10px; border-radius:50%; flex:none; box-shadow:0 0 8px currentColor; }
  .lg-item .n{ color:var(--ink-faint); font-size:10px; }

  /* keyboard focus — visible accent ring on every interactive control */
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }
  #search:focus-visible{ outline-offset:-1px; }

  @media (max-width:720px){
    #hud-top{ grid-template-columns:1fr; gap:9px; padding:10px 14px; }
    .brand{ font-size:13px; }
    #telemetry{ text-align:left; justify-self:start; }
    #readout{ top:auto; bottom:12px; left:12px; right:12px; width:auto; height:52vh; }
    #legend{ left:12px; right:12px; bottom:auto; top:auto; display:none; }
    #unit{ display:none; }
  }
  /* reduced motion — freeze aurora drift; particles/entry/pulse/dash frozen in JS.
     Glow and layout stay; nothing moves. */
  @media (prefers-reduced-motion:reduce){
    *{ transition-duration:.001ms !important; animation:none !important; }
    #aurora{ animation:none !important; }
  }
  /* reduced transparency — glass panels become solid fills, no backdrop blur */
  @media (prefers-reduced-transparency:reduce){
    #readout{ background:#0B0F18; backdrop-filter:none; -webkit-backdrop-filter:none; }
    .rd-core{ background:#0B0F18; }
    #hud-top{ background:#080B12; backdrop-filter:none; -webkit-backdrop-filter:none; }
    #legend{ background:#0B0F18; backdrop-filter:none; -webkit-backdrop-filter:none; }
    #grain{ display:none; }
  }
</style>

<div id="aurora"></div>
<div id="vignette"></div>
<canvas id="particles"></canvas>

<div id="app">
  <header id="hud-top">
    <div class="brand">RADIOCHECK <span class="dim">// DOCS-BRAIN</span></div>
    <input id="search" placeholder="SEARCH / filtrar docs" autocomplete="off" spellcheck="false" aria-label="Buscar docs">
    <div id="telemetry" class="mono"></div>
  </header>
  <canvas id="graph"></canvas>
  <aside id="readout" hidden></aside>
  <footer id="legend" class="mono"></footer>
</div>

<div id="grain"></div>
<div id="marks">
  <i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i>
  <b class="c1"></b><b class="c2"></b><b class="c3"></b><b class="c4"></b>
</div>
<div id="unit"></div>

<script id="brain-data" type="application/json">__BRAIN_DATA__</script>

<script>
(function(){
  "use strict";

  // ── data ────────────────────────────────────────────────────────────────
  var DATA = JSON.parse(document.getElementById('brain-data').textContent);
  var nodes = Array.isArray(DATA.nodes) ? DATA.nodes : [];
  var edges = Array.isArray(DATA.edges) ? DATA.edges : [];
  var counts = DATA.counts || {};

  // Seeded PRNG (mulberry32) with a FIXED seed → the initial layout is identical
  // and well-centred on every load (deterministic, reproducible).
  function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  var rng = mulberry32(0x9E3779B1);

  // ── categorical palettes (calibrated with /dataviz on surface #05060A) ────
  // FOLDER: 8 vivid chromatic identity hues + 2 deliberately-neutral folders
  // (root = pale steel "meta/index", archive = dim slate "inactive"), separated
  // by lightness. Worst all-pairs CVD 9.1 (floor band) → legend + hover labels
  // + force-layout clustering are the required secondary encoding.
  var FOLDER_COLORS = {
    'architecture'   : '#38E1FF',  // arc-reactor cyan (accent) — core structure
    'features'       : '#22D39B',  // emerald — shipped features
    'incidents'      : '#FF5468',  // coral-red — postmortems
    'operations'     : '#FFB84D',  // amber (accent-2) — running ops
    'roadmap'        : '#2E9E6B',  // deep green — future plans
    'runbooks'       : '#4C8DFF',  // azure — procedures/reference
    'superpowers'    : '#FF6EC7',  // magenta — skills/specs (largest folder)
    'subagentic-use' : '#FF8A3C',  // orange — subagent guidance
    'root'           : '#D7E1F2',  // pale steel — top-level / meta (neutral)
    'archive'        : '#7C8BA3'   // dim slate — archived / inactive (neutral)
  };
  var FOLDER_FALLBACK = '#8FA0B8';
  // STATUS: lifecycle state. Dominant states (implementado 87, null 79) strongly
  // separated; 1–2-doc states sit in the floor band (paired with legend labels).
  var STATUS_COLORS = {
    'implementado'               : '#2FD48B',  // green — done / good
    'parcialmente-implementado'  : '#FFC24D',  // amber — partial / warning
    'legado'                     : '#E97D45',  // rust — aging / serious
    'planejado'                  : '#5A9BFF',  // azure — planned
    'resolvido'                  : '#33D6C4',  // teal — resolved
    'proposta-futura'            : '#FF7AB0',  // rose — speculative
    'null'                       : '#7C8BA3'   // slate — unlabeled / unknown
  };
  var STATUS_FALLBACK = '#7C8BA3';

  var FOLDER_LABEL = { 'subagentic-use':'subagentic', 'root':'root', 'archive':'archive' };
  function folderLabel(f){ return (FOLDER_LABEL[f] || f || 'root'); }
  function statusKey(s){ return (s === null || s === undefined || s === '') ? 'null' : String(s); }
  function statusLabel(s){ return statusKey(s) === 'null' ? 'sem-status' : statusKey(s); }

  // ── node/edge model (Layer-2/3 ready: x,y,vx,vy,r,deg,match on each node) ──
  var idIndex = new Map();
  nodes.forEach(function(n){ idIndex.set(n.id, n); });
  nodes.forEach(function(n){
    var deg = ((n.outLinks && n.outLinks.length) || 0) + ((n.backLinks && n.backLinks.length) || 0);
    n.deg = deg;
    n.r = 4 + Math.sqrt(deg);        // disc radius (screen px, constant across zoom)
    n.x = null; n.y = null; n.vx = 0; n.vy = 0;
    n.match = true;                  // search state
  });
  // keep only edges whose endpoints resolve
  edges = edges.filter(function(e){ return idIndex.has(e.source) && idIndex.has(e.target); });

  // ── force-directed layout (O(n²), fine for ~190; runs once on load/resize) ─
  function simulate(nodes, edges, opt){
    var W = opt.W, H = opt.H, iterations = opt.iterations || 300;
    var rand = opt.rand || Math.random;   // seeded PRNG on first layout → deterministic
    var K=0.02, REP=1400, SPRING=0.008, DAMP=0.85, CENTER=0.0009;
    var idx = new Map(nodes.map(function(n,i){ return [n.id,i]; }));
    for (var s=0;s<nodes.length;s++){ var n0=nodes[s];
      n0.vx=0; n0.vy=0;
      if(n0.x==null){ var a=rand()*6.283; n0.x=W/2+Math.cos(a)*Math.min(W,H)*0.3; n0.y=H/2+Math.sin(a)*Math.min(W,H)*0.3; }
    }
    for (var it=0; it<iterations; it++){
      for (var i=0;i<nodes.length;i++){ var a=nodes[i];
        for (var j=i+1;j<nodes.length;j++){ var b=nodes[j];
          var dx=a.x-b.x, dy=a.y-b.y, d2=dx*dx+dy*dy+0.01, d=Math.sqrt(d2);
          var f=REP/d2, fx=dx/d*f, fy=dy/d*f;
          a.vx+=fx; a.vy+=fy; b.vx-=fx; b.vy-=fy;
        }
        a.vx+=(W/2-a.x)*CENTER; a.vy+=(H/2-a.y)*CENTER;
      }
      for (var e=0;e<edges.length;e++){ var ed=edges[e];
        var na=nodes[idx.get(ed.source)], nb=nodes[idx.get(ed.target)];
        if(!na||!nb) continue;
        var ex=nb.x-na.x, ey=nb.y-na.y; na.vx+=ex*SPRING; na.vy+=ey*SPRING; nb.vx-=ex*SPRING; nb.vy-=ey*SPRING;
      }
      for (var k=0;k<nodes.length;k++){ var nn=nodes[k]; nn.x+=(nn.vx*=DAMP)*K*50; nn.y+=(nn.vy*=DAMP)*K*50; }
    }
  }

  // ── viewport / DPI ────────────────────────────────────────────────────────
  var canvas = document.getElementById('graph');
  var ctx = canvas.getContext('2d');
  var W=0, H=0, dpr=1;
  var view = { x:0, y:0, scale:1 };
  var didFit = false;

  function sizeCanvas(){
    var rect = canvas.getBoundingClientRect();
    W = rect.width; H = rect.height;
    dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.round(W*dpr));
    canvas.height = Math.max(1, Math.round(H*dpr));
    ctx.setTransform(dpr,0,0,dpr,0,0);  // draw in CSS px; positions projected manually
  }

  // world → screen projection (node sizes/line widths stay constant on screen)
  function sx(n){ return view.x + n.x*view.scale; }
  function sy(n){ return view.y + n.y*view.scale; }

  function clamp(v,lo,hi){ return v<lo?lo:(v>hi?hi:v); }

  function fitView(){
    if(!nodes.length){ view={x:W/2,y:H/2,scale:1}; return; }
    // ROBUST fit. Raw min/max is dominated by a few far-flung outliers, and even the
    // mean centroid is pulled toward them (asymmetric outliers → core drifts off to a
    // side). So center on the MEDIAN position (outlier-resistant) and size by a
    // PERCENTILE radius: the dense mass fills the frame, the ~12% extreme nodes may
    // clip off at the default zoom (fine — wheel-zoom-out reveals them).
    var xs = nodes.map(function(n){ return n.x; }).sort(function(a,b){ return a-b; });
    var ys = nodes.map(function(n){ return n.y; }).sort(function(a,b){ return a-b; });
    var cx = xs[Math.floor(xs.length/2)], cy = ys[Math.floor(ys.length/2)];
    var ds = nodes.map(function(n){ return Math.hypot(n.x-cx, n.y-cy); }).sort(function(a,b){ return a-b; });
    var R = Math.max(1, ds[Math.floor(ds.length*0.86)] || 1);   // 86th-percentile radius = core edge
    var insetT=88, insetB=104, insetX=60;
    var availW=Math.max(80, W-insetX*2), availH=Math.max(80, H-insetT-insetB);
    // map the core DIAMETER (2R) to ~72% of the smaller available dimension, centered
    var target = Math.min(availW, availH) * 0.72;
    var s = clamp(target / (2*R), 0.08, 3.2);
    view.scale=s;
    view.x=(insetX+availW/2) - cx*s;
    view.y=(insetT+availH/2) - cy*s;
  }

  // ── colour + brightness state ────────────────────────────────────────────
  var colorMode = 'folder';        // 'folder' | 'status'
  var activeCat = null;            // legend isolation for the current mode
  var activeQuery = '';
  function nodeColor(n){
    if(colorMode==='status') return STATUS_COLORS[statusKey(n.status)] || STATUS_FALLBACK;
    return FOLDER_COLORS[n.folder] || FOLDER_FALLBACK;
  }
  function nodeCat(n){ return colorMode==='status' ? statusKey(n.status) : (n.folder||'root'); }
  function isBright(n){
    if(activeQuery && !n.match) return false;
    if(activeCat!=null && nodeCat(n)!==activeCat) return false;
    return true;
  }

  // ── Layer 2 — focus state, glow sprites, and the unified scene ─────────────
  var hovered = null;
  var selected = null;
  var focusSet = null;      // ids in the focused neighbourhood (node + its neighbours)
  var flowEdges = [];       // edges incident to the focus node (animated "data flow")
  var flowEdgeSet = null;   // Set(flowEdges) for O(1) skip in the base-edge pass
  var focusNodeRef = null;  // node driving focus/context (persists through fade-out)

  function activeFocus(){ return hovered || selected; }
  function computeFocus(){
    var fn = activeFocus();
    if(!fn) return;                          // keep the prior set alive during fade-out
    focusNodeRef = fn;
    focusSet = new Set([fn.id]); flowEdges = [];
    for(var i=0;i<edges.length;i++){ var e=edges[i];
      if(e.source===fn.id){ focusSet.add(e.target); flowEdges.push(e); }
      else if(e.target===fn.id){ focusSet.add(e.source); flowEdges.push(e); }
    }
    flowEdgeSet = new Set(flowEdges);
  }

  // hex → rgba, used to build the glow gradients once
  function hexRgb(h){ h=(h||'#8899aa').replace('#',''); if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2]; var n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255]; }
  function rgba(h,a){ var c=hexRgb(h); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }

  // Cached sprites: built once per colour, blitted every frame (no per-frame gradient
  // allocation). Layer 3 can register particle/aurora sprites the same way.
  var SPRITE=128, haloCache={}, coreCache={};
  function haloSprite(color){
    if(haloCache[color]) return haloCache[color];
    var c=document.createElement('canvas'); c.width=SPRITE; c.height=SPRITE;
    var g=c.getContext('2d'), m=SPRITE/2, grad=g.createRadialGradient(m,m,0,m,m,m);
    grad.addColorStop(0.00, rgba(color,0.55));
    grad.addColorStop(0.22, rgba(color,0.30));
    grad.addColorStop(0.50, rgba(color,0.09));
    grad.addColorStop(1.00, rgba(color,0));
    g.fillStyle=grad; g.fillRect(0,0,SPRITE,SPRITE);
    return (haloCache[color]=c);
  }
  function coreSprite(color){
    if(coreCache[color]) return coreCache[color];
    var c=document.createElement('canvas'); c.width=SPRITE; c.height=SPRITE;
    var g=c.getContext('2d'), m=SPRITE/2, grad=g.createRadialGradient(m,m,0,m,m,m);
    grad.addColorStop(0.00, 'rgba(234,242,255,1)');    // near-white hot centre (--ink)
    grad.addColorStop(0.30, rgba(color,1));
    grad.addColorStop(0.82, rgba(color,1));
    grad.addColorStop(1.00, rgba(color,0));            // soft anti-aliased edge
    g.fillStyle=grad; g.fillRect(0,0,SPRITE,SPRITE);
    return (coreCache[color]=c);
  }

  // animation state — ff is the eased focus factor (0 = neutral, 1 = focus+context)
  var ff=0, ffFrom=0, ffTo=0, ffT0=0, FF_DUR=340;
  var animClock=0, dashOffset=0, rafId=0;
  function setFocusTarget(v){ if(ffTo!==v){ ffFrom=ff; ffTo=v; ffT0=performance.now(); } }

  // entry animation — nodes materialise with a staggered fade+scale (once, on load).
  // entryFactor(i) is that node's 0..1 progress; entryGlobal() fades the edge web in.
  var entryT0=0, entryDone=false, ENTRY_DUR=560, ENTRY_STAG=210;
  function entryFactor(i){
    if(entryDone || reduceMotion) return 1;
    var delay = nodes.length>1 ? (i/(nodes.length-1))*ENTRY_STAG : 0;
    var t = performance.now() - entryT0 - delay;
    if(t<=0) return 0;
    return easeFn(clamp(t/ENTRY_DUR,0,1));
  }
  function entryGlobal(){
    if(entryDone || reduceMotion) return 1;
    return clamp((performance.now()-entryT0)/(ENTRY_DUR+ENTRY_STAG),0,1);
  }
  function runEntry(){
    if(reduceMotion){ entryDone=true; invalidate(); render(); return; }
    entryDone=false; entryT0=performance.now();
    (function step(){
      invalidate(); render();
      if(performance.now()-entryT0 < ENTRY_DUR+ENTRY_STAG+40){ requestAnimationFrame(step); }
      else { entryDone=true; invalidate(); render(); }   // final crisp frame, then idle
    })();
  }

  // per-node effective alpha: search/legend dim × focus/context dim (all tied to ff
  // so the neighbourhood dims IN and back OUT smoothly)
  function nodeAlpha(n){
    var a = isBright(n) ? 1 : 0.10;
    if(focusSet && !focusSet.has(n.id)) a *= (1 - 0.88*ff);
    return a;
  }

  // The whole scene, drawn into either the main ctx (sharp) or the ½-res bloom ctx.
  // Structured as discrete passes so Layer 3 can insert particle/aurora passes.
  function drawScene(g, bloom){
    var searching = !!activeQuery || activeCat!=null;
    var eg = entryGlobal();                     // 0..1 edge-web materialise on load
    // 1. base hairline web — sharp layer only (too faint to be worth blooming)
    if(!bloom){
      g.lineWidth=1; g.strokeStyle='rgba(126,176,255,0.22)';
      for(var i=0;i<edges.length;i++){
        var e=edges[i];
        if(flowEdgeSet && flowEdgeSet.has(e)) continue;      // drawn as flow below
        var a=idIndex.get(e.source), b=idIndex.get(e.target);
        var lit = !searching || (isBright(a)&&isBright(b));
        var cdim = (focusSet && !(focusSet.has(e.source)&&focusSet.has(e.target))) ? (1-0.88*ff) : 1;
        g.globalAlpha = (lit?1:0.05) * cdim * eg;
        g.beginPath(); g.moveTo(sx(a),sy(a)); g.lineTo(sx(b),sy(b)); g.stroke();
      }
      g.globalAlpha=1;
    }
    // 2. flow edges — accent cyan, fade in with ff; animated dash (sharp) / solid (bloom)
    if(flowEdges.length && ff>0.001){
      g.save();
      g.lineCap='round'; g.strokeStyle=rgba('#38E1FF',0.95);
      g.lineWidth = bloom?2.4:1.7; g.globalAlpha=ff;
      if(!bloom){ g.setLineDash([7,9]); g.lineDashOffset=dashOffset; }
      for(var j=0;j<flowEdges.length;j++){
        var fe=flowEdges[j], fa=idIndex.get(fe.source), fb=idIndex.get(fe.target);
        g.beginPath(); g.moveTo(sx(fa),sy(fa)); g.lineTo(sx(fb),sy(fb)); g.stroke();
      }
      g.restore(); g.globalAlpha=1;
    }
    // 3. node halos — additive radial glow (light emitting from each doc)
    g.globalCompositeOperation='lighter';
    for(var k=0;k<nodes.length;k++){
      var n=nodes[k], na=nodeAlpha(n); if(na<0.02) continue;
      var ek=entryFactor(k); if(ek<=0) continue;                    // staggered materialise
      var isF=(n===focusNodeRef);
      var pulse = isF ? (1 + 0.18*ff*Math.sin(animClock/380)) : 1;   // slow breathing
      var hr = n.r * (bloom?4.2:3.4) * pulse * (0.4+0.6*ek);         // hubs glow more (bigger r)
      var px=sx(n), py=sy(n);
      g.globalAlpha = na * (bloom?1:0.85) * (isF ? 1+0.35*ff : 1) * ek;
      g.drawImage(haloSprite(nodeColor(n)), px-hr, py-hr, hr*2, hr*2);
    }
    g.globalCompositeOperation='source-over'; g.globalAlpha=1;
    if(bloom) return;               // bloom pass = glow only; cores/rings/labels stay sharp
    // 4. bright cores — near-white hot centre → folder/status colour
    for(var q=0;q<nodes.length;q++){
      var nc=nodes[q], ca=nodeAlpha(nc); if(ca<0.02) continue;
      var eq=entryFactor(q); if(eq<=0) continue;                    // staggered materialise
      var isFc=(nc===focusNodeRef);
      var pc = isFc ? (1 + 0.09*ff*Math.sin(animClock/380)) : 1;
      var cr = nc.r * 1.35 * pc * (0.4+0.6*eq), cx2=sx(nc), cy2=sy(nc);
      g.globalAlpha=ca*eq;
      g.drawImage(coreSprite(nodeColor(nc)), cx2-cr, cy2-cr, cr*2, cr*2);
    }
    g.globalAlpha=1;
    // 5. focus ring
    if(focusNodeRef && ff>0.02) ring(focusNodeRef, rgba('#38E1FF', 0.45+0.45*ff), 4);
  }

  function ring(n, color, gap){
    var px=sx(n), py=sy(n);
    ctx.strokeStyle=color; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(px,py,n.r+gap,0,6.2832); ctx.stroke();
  }

  function drawLabels(){
    var showAll = view.scale > 2.2;
    ctx.font = '600 10px ui-monospace, "JetBrains Mono", "Cascadia Code", Consolas, monospace';
    ctx.textBaseline = 'middle';
    for(var i=0;i<nodes.length;i++){
      var n=nodes[i];
      var force = (n===hovered) || (n===selected);
      if(!force && !showAll) continue;
      if(!isBright(n) && !force) continue;
      label(n.title, sx(n)+n.r+7, sy(n), force);
    }
  }

  function label(text, x, y, strong){
    var t = text || '';
    var w = ctx.measureText(t).width;
    // clamp horizontally so labels never run off-canvas
    if(x + w + 12 > W) x = W - w - 12;
    if(x < 6) x = 6;
    var padX=6, h=15;
    ctx.globalAlpha = strong ? 0.96 : 0.8;
    ctx.fillStyle = 'rgba(5,7,12,0.82)';
    roundRect(x-padX, y-h/2, w+padX*2, h, 4); ctx.fill();
    ctx.strokeStyle = strong ? 'rgba(56,225,255,0.4)' : 'rgba(120,170,255,0.16)';
    ctx.lineWidth = 1; roundRect(x-padX, y-h/2, w+padX*2, h, 4); ctx.stroke();
    ctx.fillStyle = strong ? '#EAF2FF' : '#B7C6DE';
    ctx.fillText(t, x, y+0.5);
    ctx.globalAlpha = 1;
  }
  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }

  // ── bloom — a ½-res blurred underlay, screened back over the sharp scene.
  // Recomputed only when the view/state changes (invalidate()); reused otherwise,
  // so a steady pulse costs one cheap sharp redraw per frame, not a bloom rebuild.
  var bloomCanvas=document.createElement('canvas');
  var bloomCtx=bloomCanvas.getContext('2d');
  var BLOOM_SCALE=0.5, bloomDirty=true;
  function invalidate(){ bloomDirty=true; }
  function buildBloom(){
    var bw=Math.max(1,Math.round(canvas.width*BLOOM_SCALE));
    var bh=Math.max(1,Math.round(canvas.height*BLOOM_SCALE));
    if(bloomCanvas.width!==bw) bloomCanvas.width=bw;
    if(bloomCanvas.height!==bh) bloomCanvas.height=bh;
    bloomCtx.setTransform(dpr*BLOOM_SCALE,0,0,dpr*BLOOM_SCALE,0,0);  // CSS px → ½-device
    bloomCtx.globalCompositeOperation='source-over';
    bloomCtx.clearRect(0,0,W,H);
    drawScene(bloomCtx, true);
    bloomDirty=false;
  }

  function render(){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
    ctx.clearRect(0,0,W,H);
    // 1. bloom underlay (blurred, additive) — the holographic wash
    if(bloomDirty) buildBloom();
    ctx.save();
    ctx.setTransform(1,0,0,1,0,0);                    // blit in device px
    ctx.globalCompositeOperation='lighter';
    ctx.globalAlpha=0.6;
    ctx.filter='blur(7px)';
    ctx.drawImage(bloomCanvas, 0,0,bloomCanvas.width,bloomCanvas.height, 0,0,canvas.width,canvas.height);
    ctx.filter='none';
    ctx.restore();
    // 2. sharp scene on top
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
    drawScene(ctx, false);
    drawLabels();
  }

  // ── the loop runs ONLY while a node is focused or focus is transitioning; it
  // stops (rafId=0) once nothing is focused and ff has eased back to 0 → idle CPU ~0.
  function loop(now){
    animClock=now;
    if(ff!==ffTo){
      var p = FF_DUR>0 ? clamp((now-ffT0)/FF_DUR,0,1) : 1;
      ff = ffFrom + (ffTo-ffFrom)*easeFn(p);          // cubic-bezier(.32,.72,0,1) feel
      if(p>=1) ff=ffTo;
      invalidate();                                   // context dimming changed → rebuild bloom
    }
    dashOffset -= 0.7;                                 // data flows toward the focus node
    render();
    if(activeFocus() || ff>0.001){
      rafId=requestAnimationFrame(loop);
    } else {                                           // settled, nothing focused → FREEZE
      rafId=0; ff=0;
      focusNodeRef=null; focusSet=null; flowEdges=[]; flowEdgeSet=null;
      render();                                        // one clean static frame, then idle
    }
  }
  function startLoop(){ if(!rafId) rafId=requestAnimationFrame(loop); }

  // called whenever hover/selection changes — drives the focus+context transition
  function updateFocus(){
    computeFocus();
    invalidate();
    if(reduceMotion){
      ff = activeFocus() ? 1 : 0;
      if(!activeFocus()){ focusNodeRef=null; focusSet=null; flowEdges=[]; flowEdgeSet=null; }
      render();
    } else {
      setFocusTarget(activeFocus() ? 1 : 0);
      startLoop();
    }
  }

  // ── hit testing (screen space) ────────────────────────────────────────────
  function hitTest(mx,my){
    var best=null, bestD=Infinity;
    for(var i=0;i<nodes.length;i++){
      var n=nodes[i];
      var d=Math.hypot(mx-sx(n), my-sy(n));
      if(d <= n.r+6 && d<bestD){ bestD=d; best=n; }
    }
    return best;
  }

  // ── selection + readout ────────────────────────────────────────────────────
  var readout = document.getElementById('readout');
  function selectNode(n){
    selected = n;
    buildReadout(n);
    openReadout();
    updateFocus();          // lights up the neighbourhood (focus+context) + pulse
  }
  function deselect(){
    selected=null;
    closeReadout();
    updateFocus();          // eases the focus back out, then the loop freezes
  }

  function el(tag, cls, txt){
    var e=document.createElement(tag);
    if(cls) e.className=cls;
    if(txt!=null) e.textContent=txt;
    return e;
  }
  function dot(color){ var d=el('span','dot'); d.style.color=color; d.style.background=color; return d; }

  function buildReadout(n){
    var core = el('div','rd-core');
    var close = el('button','rd-close','✕');
    close.setAttribute('aria-label','fechar');
    close.addEventListener('click', deselect);
    core.appendChild(close);

    core.appendChild(el('p','rd-eyebrow','NODE // '+folderLabel(n.folder)));
    core.appendChild(el('h3','rd-title', n.title || n.id));

    // meta chips: folder · status · verificação
    var meta = el('div','rd-meta');
    var fchip = el('span','chip'); fchip.appendChild(dot(FOLDER_COLORS[n.folder]||FOLDER_FALLBACK));
    fchip.appendChild(document.createTextNode(folderLabel(n.folder))); meta.appendChild(fchip);
    var schip = el('span','chip'); schip.appendChild(dot(STATUS_COLORS[statusKey(n.status)]||STATUS_FALLBACK));
    schip.appendChild(document.createTextNode(statusLabel(n.status))); meta.appendChild(schip);
    if(n.ultimaVerificacao){
      var vchip = el('span','chip','◉ '+n.ultimaVerificacao); meta.appendChild(vchip);
    }
    core.appendChild(meta);

    if(n.summary){
      var sec = el('div','rd-section');
      sec.appendChild(el('h4',null,'Resumo'));
      sec.appendChild(el('p','rd-summary', n.summary));
      core.appendChild(sec);
    }

    // código relacionado — links to repo files (repo root is ../../ from docs/brain/)
    if(n.codigoRelacionado && n.codigoRelacionado.length){
      var csec = el('div','rd-section');
      csec.appendChild(el('h4',null,'Código relacionado'));
      var ul = el('ul','rd-code');
      n.codigoRelacionado.forEach(function(p){
        var li=el('li'); var a=el('a',null,p); a.setAttribute('href','../../'+p); a.setAttribute('title',p);
        li.appendChild(a); ul.appendChild(li);
      });
      csec.appendChild(ul); core.appendChild(csec);
    }

    core.appendChild(linkSection('Aponta para ('+(n.outLinks?n.outLinks.length:0)+')', n.outLinks));
    core.appendChild(linkSection('Referenciado por ('+(n.backLinks?n.backLinks.length:0)+')', n.backLinks));

    // stats
    var stats = el('div','rd-stats');
    stats.appendChild(statBlock('grau', String(n.deg)));
    stats.appendChild(statBlock('palavras', String(n.wordCount!=null?n.wordCount:'—')));
    stats.appendChild(statBlock('seções', String((n.headings&&n.headings.length)||0)));
    core.appendChild(stats);

    readout.innerHTML='';
    readout.appendChild(core);
  }

  function linkSection(heading, ids){
    var sec = el('div','rd-section');
    sec.appendChild(el('h4',null,heading));
    if(!ids || !ids.length){
      sec.appendChild(el('div','rd-empty','— nenhum'));
      return sec;
    }
    var wrap = el('div','rd-links');
    ids.forEach(function(id){
      var t = idIndex.get(id);
      var btn = el('button','linkbtn');
      btn.appendChild(dot(t ? (FOLDER_COLORS[t.folder]||FOLDER_FALLBACK) : FOLDER_FALLBACK));
      var span = el('span','lb-title', t ? (t.title||id) : id);
      btn.appendChild(span);
      if(t){ btn.addEventListener('click', function(){ focusNode(id); }); }
      else { btn.disabled = true; btn.style.opacity=.5; }
      wrap.appendChild(btn);
    });
    sec.appendChild(wrap);
    return sec;
  }
  function statBlock(k,v){
    var s=el('div','rd-stat');
    s.appendChild(el('span','k',k));
    s.appendChild(el('span','v',v));
    return s;
  }

  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  var readoutRaf = 0;
  function openReadout(){
    readout.hidden = false;
    cancelAnimationFrame(readoutRaf);
    if(reduceMotion){ readout.classList.add('open'); return; }
    readout.classList.remove('open');
    readoutRaf = requestAnimationFrame(function(){ requestAnimationFrame(function(){ readout.classList.add('open'); }); });
  }
  function closeReadout(){
    readout.classList.remove('open');
    if(reduceMotion){ readout.hidden=true; return; }
    setTimeout(function(){ if(!selected) readout.hidden=true; }, 340);
  }

  // ── focus / recenter a node (used by link buttons) ─────────────────────────
  function bez(p1x,p1y,p2x,p2y){
    // cubic-bezier(p1x,p1y,p2x,p2y) time remap, matching --ease .32,.72,0,1
    function cx(t){ return 3*p1x*t*(1-t)*(1-t)+3*p2x*t*t*(1-t)+t*t*t; }
    function cy(t){ return 3*p1y*t*(1-t)*(1-t)+3*p2y*t*t*(1-t)+t*t*t; }
    return function(x){
      var lo=0, hi=1, t=x;
      for(var i=0;i<20;i++){ var xe=cx(t)-x; if(Math.abs(xe)<1e-4) break; if(xe>0)hi=t; else lo=t; t=(lo+hi)/2; }
      return cy(t);
    };
  }
  var easeFn = bez(0.32,0.72,0,1);
  var animRaf = 0;
  function animateView(tx,ty){
    cancelAnimationFrame(animRaf);
    if(reduceMotion){ view.x=tx; view.y=ty; invalidate(); render(); return; }
    var sx0=view.x, sy0=view.y, t0=performance.now(), dur=440;
    (function step(now){
      var p=clamp((now-t0)/dur,0,1), k=easeFn(p);
      view.x=sx0+(tx-sx0)*k; view.y=sy0+(ty-sy0)*k;
      invalidate(); render();
      if(p<1) animRaf=requestAnimationFrame(step);
    })(t0);
  }
  function focusNode(id){
    var n=idIndex.get(id); if(!n) return;
    selectNode(n);
    animateView(W/2 - n.x*view.scale, H/2 - n.y*view.scale);
  }

  // ── pointer: pan (drag) / hover / click-select / wheel-zoom ─────────────────
  var isDown=false, moved=0, downX=0, downY=0, downVX=0, downVY=0, pid=null;
  function localXY(ev){
    var rect=canvas.getBoundingClientRect();
    return [ev.clientX-rect.left, ev.clientY-rect.top];
  }
  canvas.addEventListener('pointerdown', function(ev){
    isDown=true; moved=0; pid=ev.pointerId;
    var p=localXY(ev); downX=p[0]; downY=p[1]; downVX=view.x; downVY=view.y;
    canvas.setPointerCapture(ev.pointerId);
    canvas.classList.add('dragging');
  });
  canvas.addEventListener('pointermove', function(ev){
    var p=localXY(ev), mx=p[0], my=p[1];
    if(isDown){
      var dx=mx-downX, dy=my-downY;
      moved=Math.max(moved, Math.abs(dx)+Math.abs(dy));
      view.x=downVX+dx; view.y=downVY+dy;
      invalidate(); render();
      return;
    }
    var h=hitTest(mx,my);
    if(h!==hovered){
      hovered=h;
      canvas.style.cursor = h ? 'pointer' : 'grab';
      updateTelemetry(); updateFocus();      // hover lights up the neighbourhood
    }
  });
  function endPointer(ev){
    if(!isDown) return;
    isDown=false; canvas.classList.remove('dragging');
    if(pid!=null && canvas.hasPointerCapture(pid)){ try{ canvas.releasePointerCapture(pid); }catch(e){} }
    var p=localXY(ev);
    if(moved<4){                       // a click, not a drag
      var h=hitTest(p[0],p[1]);
      if(h) selectNode(h); else deselect();
    }
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', function(){ isDown=false; canvas.classList.remove('dragging'); });
  // I2: pointermove only fires over the canvas — leaving it (onto the search box /
  // legend / out of the window) must clear hover so the focus loop can settle & FREEZE.
  canvas.addEventListener('pointerleave', function(){
    if(hovered){ hovered=null; canvas.style.cursor='grab'; updateTelemetry(); updateFocus(); }
  });

  canvas.addEventListener('wheel', function(ev){
    ev.preventDefault();
    var p=localXY(ev), mx=p[0], my=p[1];
    var factor=Math.exp(-ev.deltaY*0.0016);
    var ns=clamp(view.scale*factor, 0.08, 8);
    factor = ns/view.scale;
    view.x = mx - (mx-view.x)*factor;
    view.y = my - (my-view.y)*factor;
    view.scale = ns;
    invalidate(); render();
  }, { passive:false });

  // ── search ─────────────────────────────────────────────────────────────────
  var searchEl = document.getElementById('search');
  function norm(s){ return (s||'').normalize('NFD').replace(/\p{Diacritic}/gu,'').toLowerCase(); }
  var matchCount = 0;
  searchEl.addEventListener('input', function(){
    var q = norm(searchEl.value.trim());
    activeQuery = q;
    matchCount = 0;
    for(var i=0;i<nodes.length;i++){
      var n=nodes[i];
      if(!q){ n.match=true; continue; }
      var hay = norm(n.title)+' '+norm(n.summary)+' '+norm((n.headings||[]).join(' '));
      n.match = hay.indexOf(q) !== -1;
      if(n.match) matchCount++;
    }
    updateTelemetry(); invalidate(); render();
  });
  searchEl.addEventListener('keydown', function(ev){
    // M3: stop the Escape from also reaching the document handler (which would
    // deselect the node/category) — clearing the search is its own action.
    if(ev.key==='Escape'){ ev.stopPropagation(); searchEl.value=''; searchEl.dispatchEvent(new Event('input')); searchEl.blur(); }
  });

  // ── telemetry ───────────────────────────────────────────────────────────────
  var telEl = document.getElementById('telemetry');
  function updateTelemetry(){
    var base = 'DOCS/<b>'+(counts.docs!=null?counts.docs:nodes.length)+'</b> · EDGES/<b>'+(counts.edges!=null?counts.edges:edges.length)+'</b>';
    if(activeQuery){
      telEl.innerHTML = base + ' · <span class="amber">MATCHES/'+matchCount+'</span>';
    } else if(hovered){
      telEl.innerHTML = base + ' · ▸ '+escapeHtml(hovered.title||hovered.id);
    } else {
      telEl.innerHTML = base;
    }
  }
  function escapeHtml(s){ return String(s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  // ── legend (folder ↔ status recolor toggle + category isolation) ────────────
  var legendEl = document.getElementById('legend');
  function categoryTally(){
    var tally = new Map();
    for(var i=0;i<nodes.length;i++){
      var c = nodeCat(nodes[i]);
      tally.set(c, (tally.get(c)||0)+1);
    }
    return tally;
  }
  function orderedCats(){
    if(colorMode==='status'){
      var order=['implementado','parcialmente-implementado','legado','resolvido','planejado','proposta-futura','null'];
      return order.filter(function(k){ return categoryTally().has(k); });
    }
    var forder=['architecture','features','operations','incidents','runbooks','superpowers','roadmap','subagentic-use','root','archive'];
    var present=categoryTally();
    return forder.filter(function(k){ return present.has(k); });
  }
  function buildLegend(){
    var tally = categoryTally();
    legendEl.innerHTML='';
    var head=el('div','lg-head');
    var toggle=el('button','lg-toggle');
    toggle.innerHTML = '[ COLOR // <b>'+(colorMode==='folder'?'FOLDER':'STATUS')+'</b> ]';
    toggle.addEventListener('click', function(){
      colorMode = (colorMode==='folder') ? 'status' : 'folder';
      activeCat = null;
      buildLegend(); updateTelemetry(); invalidate(); render();
    });
    head.appendChild(toggle);
    head.appendChild(el('span','lg-hint', activeCat? 'isolando → clique p/ limpar' : 'clique p/ isolar'));
    legendEl.appendChild(head);

    var items=el('div','lg-items');
    var pal = colorMode==='status' ? STATUS_COLORS : FOLDER_COLORS;
    var fb  = colorMode==='status' ? STATUS_FALLBACK : FOLDER_FALLBACK;
    orderedCats().forEach(function(cat){
      var color = pal[cat] || fb;
      var item = el('div','lg-item');
      item.tabIndex=0; item.setAttribute('role','button');
      item.setAttribute('aria-pressed', activeCat===cat ? 'true' : 'false');
      if(activeCat!=null && activeCat!==cat) item.classList.add('muted');
      if(activeCat===cat) item.classList.add('active');
      var sw=el('span','sw'); sw.style.color=color; sw.style.background=color; item.appendChild(sw);
      var name = colorMode==='status' ? statusLabel(cat==='null'?null:cat) : folderLabel(cat);
      item.appendChild(el('span','lbl',name));
      item.appendChild(el('span','n',String(tally.get(cat)||0)));
      function toggleCat(){ activeCat = (activeCat===cat) ? null : cat; buildLegend(); invalidate(); render(); }
      item.addEventListener('click', toggleCat);
      item.addEventListener('keydown', function(ev){ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); toggleCat(); } });
      items.appendChild(item);
    });
    legendEl.appendChild(items);
  }

  // ── global keys ─────────────────────────────────────────────────────────────
  document.addEventListener('keydown', function(ev){
    if(ev.key==='Escape'){
      if(selected){ deselect(); return; }
      if(activeCat!=null){ activeCat=null; buildLegend(); invalidate(); render(); return; }
    }
  });

  // ── ambient particle field — its own light canvas behind the graph. A very cheap
  // continuous rAF (~60 particles, additive) is the ONLY perpetual loop; it pauses
  // under reduced-motion and when the tab is hidden. The graph's own (expensive)
  // render loop still idle-freezes — only this featherweight layer keeps drifting.
  var pcv=document.getElementById('particles'), pctx=pcv.getContext('2d');
  var particles=[], pW=0, pH=0, pDpr=1, particleRaf=0;
  function sizeParticles(){
    var r=pcv.getBoundingClientRect(); pW=r.width; pH=r.height; pDpr=window.devicePixelRatio||1;
    pcv.width=Math.max(1,Math.round(pW*pDpr)); pcv.height=Math.max(1,Math.round(pH*pDpr));
    pctx.setTransform(pDpr,0,0,pDpr,0,0);
  }
  function initParticles(){
    sizeParticles();
    var N=Math.max(46, Math.min(70, Math.round(pW*pH/26000)));
    particles=[];
    for(var i=0;i<N;i++){
      particles.push({ x:Math.random()*pW, y:Math.random()*pH,
        vx:(Math.random()-0.5)*0.14, vy:(Math.random()-0.5)*0.14,
        r:0.5+Math.random()*1.3, a:0.03+Math.random()*0.045 });
    }
  }
  function drawParticles(){
    pctx.clearRect(0,0,pW,pH);
    pctx.globalCompositeOperation='lighter'; pctx.fillStyle='#38E1FF';
    for(var i=0;i<particles.length;i++){ var p=particles[i];
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<-3)p.x=pW+3; else if(p.x>pW+3)p.x=-3;
      if(p.y<-3)p.y=pH+3; else if(p.y>pH+3)p.y=-3;
      pctx.globalAlpha=p.a;
      pctx.beginPath(); pctx.arc(p.x,p.y,p.r,0,6.2832); pctx.fill();
    }
    pctx.globalAlpha=1; pctx.globalCompositeOperation='source-over';
  }
  function particleLoop(){ drawParticles(); particleRaf=requestAnimationFrame(particleLoop); }
  function startParticles(){
    if(reduceMotion){ drawParticles(); return; }        // static field, no loop
    if(!particleRaf && !document.hidden) particleRaf=requestAnimationFrame(particleLoop);
  }
  function stopParticles(){ if(particleRaf){ cancelAnimationFrame(particleRaf); particleRaf=0; } }
  document.addEventListener('visibilitychange', function(){ if(document.hidden) stopParticles(); else startParticles(); });

  // ── boot ────────────────────────────────────────────────────────────────────
  function layout(){
    sizeCanvas();
    // seeded init → identical, well-centred layout every load; extra iterations let
    // the core settle into an organic mass (given constants unchanged, more relaxation)
    simulate(nodes, edges, { W:W||1200, H:H||800, iterations:360, rand:rng });
    if(!didFit){ fitView(); didFit=true; }
    invalidate(); runEntry();          // materialise the graph, then idle-freeze
  }
  var resizeT=0;
  window.addEventListener('resize', function(){
    clearTimeout(resizeT);
    resizeT=setTimeout(function(){
      // M2: the layout is seeded/deterministic and already settled — re-running the
      // force sim would visibly drift it. Just re-size and re-fit (re-centre) for the
      // new dimensions; positions are preserved.
      sizeCanvas(); sizeParticles();
      fitView();
      invalidate(); render();
      if(reduceMotion) drawParticles();
    }, 160);
  });

  // honest static build/unit tag (schemaVersion is real data; L3 + unit id are true)
  document.getElementById('unit').textContent =
    '[ REV·L3 · SCHEMA·'+(DATA.schemaVersion!=null?DATA.schemaVersion:1)+' · UNIT·RC-BRAIN ]';

  buildLegend();
  updateTelemetry();
  initParticles();
  startParticles();
  layout();
})();
</script>
