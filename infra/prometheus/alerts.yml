groups:
  - name: radiocheck
    rules:
      - alert: StreamDownProlongado
        expr: increase(radiocheck_worker_bytes_received_total[10m]) == 0 and on() radiocheck_worker_active_total > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Worker sem bytes por 10min: {{ $labels.station_id }}"

      - alert: EvidenceUploadFailures
        expr: increase(radiocheck_evidence_upload_failures_total[1h]) > 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Mais de 10 falhas de upload de evidência na última hora"

      # Cobre TODOS os filesystems reais, não só "/". O incidente 2026-07-02
      # (MinIO 507 storage-full) passou despercebido porque o disco cheio era
      # /mnt/data (evidência do MinIO) e este alerta só olhava "/". O regex
      # exclui pseudo-FS (tmpfs/overlay) pra não gerar ruído. {{ $labels.mountpoint }}
      # identifica qual disco encheu.
      - alert: DiskSpaceCritical
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|devtmpfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|devtmpfs"} < 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disco {{ $labels.mountpoint }} com menos de 5% livre"

      # Aviso antecipado: dá folga pra crescer o disco / rodar o prune antes de o
      # MinIO começar a rejeitar upload de evidência com 507 (o reserve do MinIO
      # dispara bem antes de 0% livre).
      - alert: DiskSpaceWarning
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|devtmpfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|devtmpfs"} < 0.15
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Disco {{ $labels.mountpoint }} com menos de 15% livre"

      - alert: BackupNotRunning
        expr: time() - radiocheck_postgres_backup_last_success_timestamp > 26 * 3600
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Backup do Postgres sem sucesso há mais de 26h"
          description: "Verifique /var/log/radiocheck/backup.log e o status do cron radiocheck-postgres."

      # F-110: defesa contra o cenário de "backup nunca rodou silenciosamente"
      # — exatamente o que aconteceu antes do incidente 2026-05-12. Se a
      # métrica nunca aparece, BackupNotRunning fica passivo (não tem dado
      # pra comparar com time()). absent() dispara explicitamente nesse caso.
      - alert: BackupMetricMissing
        expr: absent(radiocheck_postgres_backup_last_success_timestamp)
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "Métrica de backup nunca apareceu — backup pipeline pode estar quebrado"
          description: |
            O container backup deveria escrever radiocheck_postgres_backup_last_success_timestamp
            via textfile collector (PROM_TEXTFILE_DIR + node-exporter). Métrica
            ausente sugere que: (1) backup nunca rodou; (2) node-exporter não
            está scrapeable; (3) caminho do textfile está errado. Sem essa
            métrica, qualquer falha de backup é silenciosa.
            Investigação:
              docker compose logs node-exporter
              docker compose logs backup
              curl prometheus:9090/api/v1/targets

      - alert: RestoreTestFailed
        expr: radiocheck_postgres_restore_test_last_status != 1
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "Último teste de restore falhou"
          description: "Veja /var/log/radiocheck/restore-test.log para o detalhe do erro."

      - alert: EvidenceTieringStalled
        expr: time() - radiocheck_evidence_tiering_last_run_timestamp > 48 * 3600
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Job de tiering de evidências não executou nas últimas 48h"

      - alert: CalibrationStale
        # Threshold: 14 dias = 2× a janela de 7d definida em §9.4. Acima disso
        # o station_thresholds está vencido — o p99 de ruído ficou velho e o
        # min_hashes pode estar fora de calibração com a operação real.
        expr: time() - radiocheck_calibration_last_success_timestamp > 14 * 24 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Calibração não roda há mais de 14d para {{ $labels.station_id }}"
          description: "Verifique o scheduler de calibração e o runbook CalibrationStale."

  # ─────────────────────────────────────────────────────────────────────
  # Novos alertas (§15.5 do plano) — adicionados 2026-05-07
  # ─────────────────────────────────────────────────────────────────────
  - name: radiocheck-novos
    interval: 30s
    rules:
      # ── R26 / falha de rede compartilhada ────────────────────────────
      - alert: MultipleStreamsDown
        expr: |
          count(increase(radiocheck_worker_bytes_received_total[5m]) == 0) >= 3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Múltiplos streams sem dados ({{ $value }} workers)"
          description: |
            {{ $value }} workers ficaram sem receber bytes nos últimos 5min.
            Causa raiz comum: rede de saída, DNS, proxy de saída ou bloqueio
            simultâneo por upstream. Investigar antes de tratar como falhas
            individuais por emissora.
          runbook_url: "docs/runbooks/MultipleStreamsDown.md"

      # ── DBLatencyHigh ────────────────────────────────────────────────
      # TODO(metrics): expor radiocheck_db_query_duration_seconds_bucket no
      # API process (pgxpool tracer ou middleware sqlc). Sem essa métrica o
      # alerta abaixo nunca dispara. Ver §15.1 do plano.
      # - alert: DBLatencyHigh
      #   expr: |
      #     histogram_quantile(
      #       0.95,
      #       rate(radiocheck_db_query_duration_seconds_bucket[5m])
      #     ) > 1
      #   for: 10m
      #   labels:
      #     severity: warning
      #   annotations:
      #     summary: "Latência p95 de queries Postgres > 1s"
      #     description: |
      #       p95 das queries Postgres ultrapassou 1s nos últimos 5min.
      #       Possíveis causas: contenção de lock, índice ausente, vacuum
      #       agressivo, plano de query degradado.
      #     runbook_url: "docs/runbooks/DBLatencyHigh.md"

      # ── EvidenceQueueGrowing ─────────────────────────────────────────
      - alert: EvidenceQueueGrowing
        expr: |
          radiocheck_evidence_queue_size > 100
          and
          deriv(radiocheck_evidence_queue_size[10m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Fila de upload de evidência crescendo ({{ $value }} itens)"
          description: |
            Spool de evidências acima de 100 itens E com derivada positiva
            nos últimos 10min — uploads não estão drenando. Provavelmente
            problema persistente de S3/R2 ou throughput de upload muito
            baixo. Se ignorado, pode esgotar disco local.
          runbook_url: "docs/runbooks/EvidenceQueueGrowing.md"

      # ── DetectionRateAnomaly ─────────────────────────────────────────
      # Versão simplificada (z-score completo é caro): dispara quando a
      # taxa instantânea cai abaixo de 30% da média móvel de 7 dias. Cobre
      # o cenário "emissoras pararam de detectar" (ex.: índice corrompido,
      # threshold incorreto pós-deploy). Não cobre spike — adicionar
      # `or rate(...) > 3 * avg_over_time(...)` se precisar.
      - alert: DetectionRateAnomaly
        expr: |
          sum(rate(radiocheck_detections_total{status="confirmed"}[10m]))
            < 0.3 * sum(avg_over_time(rate(radiocheck_detections_total{status="confirmed"}[10m])[7d:10m]))
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Taxa de detecção 70% abaixo da média de 7 dias"
          description: |
            Total de detecções confirmadas por minuto caiu para menos de
            30% da média histórica de 7 dias. Possíveis causas: índice
            não recarregado após troca de comerciais, threshold deslocado,
            quedas em massa de stream (ver MultipleStreamsDown).
          runbook_url: "docs/runbooks/DetectionRateAnomaly.md"

      # ── WorkerHighMemory ─────────────────────────────────────────────
      # Indicador de memory leak (R28). Threshold 1.5 GiB por worker
      # individual; ajustar quando o footprint real do índice for medido.
      # Depende de cAdvisor exportando container_memory_working_set_bytes.
      - alert: WorkerHighMemory
        expr: |
          container_memory_working_set_bytes{name=~"radiocheck-worker.*|api"}
            > 1.5 * 1024 * 1024 * 1024
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Worker consumindo >1.5 GiB de memória ({{ $labels.name }})"
          description: |
            Container {{ $labels.name }} está acima de 1.5 GiB de RSS por
            mais de 30min. Indicador típico de memory leak (R28). O restart
            preventivo (§8.7) deve cobrir, mas se reincidir investigar.
          runbook_url: "docs/runbooks/WorkerHighMemory.md"

      # ── ClockDrift ───────────────────────────────────────────────────
      # TODO(metrics): node_exporter precisa estar rodando em cada host
      # com a coleção `time` habilitada para expor `node_timex_offset_seconds`.
      # A regra abaixo dispara quando |offset| > 2s em qualquer node. Drift
      # afeta correlação de timestamps de detecção entre workers/host de DB.
      - alert: ClockDrift
        expr: |
          abs(node_timex_offset_seconds) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Clock drift > 2s em {{ $labels.instance }}"
          description: |
            Diferença de relógio em {{ $labels.instance }} excedeu 2s.
            Compromete a correlação temporal de detecções e a janela de
            cooldown. Verificar `chrony`/`systemd-timesyncd` no host.
          runbook_url: "docs/runbooks/ClockDrift.md"

      # ─────────────────────────────────────────────────────────────────
      # Alertas do incidente 2026-06-12 (falhas silenciosas de recall)
      # ─────────────────────────────────────────────────────────────────

      # ── FingerprintStuck ─────────────────────────────────────────────
      # Material preso na fila de fingerprint = invisível pro matching.
      # O reconciler (internal/fingerprintqueue) re-tenta sozinho; este
      # alerta pega o que o retry NÃO resolve (arquivo corrompido, serviço
      # fingerprint morto, falha permanente). No incidente, materiais
      # ficaram 1 MÊS presos sem ninguém saber.
      - alert: FingerprintStuck
        expr: sum(radiocheck_fingerprint_stuck) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} materiais com fingerprint preso há >30min (retry não resolveu)"
          description: |
            O reconciler re-publica fingerprint.generate a cada 5min; se o
            gauge segue >0 por 30min, o retry não está resolvendo. Causas:
            serviço fingerprint fora, arquivo de áudio corrompido (status
            failed re-falhando), master ausente no storage.
          runbook_url: "docs/runbooks/FingerprintStuck.md"

      # ── WorkerStallLoop ──────────────────────────────────────────────
      # Emissora reiniciando em loop = zero captura naquela rádio. No
      # incidente, a Jovem Pan flapou por ~1 dia (geo-block 403) em loop
      # de restart a cada 120s sem ninguém perceber.
      - alert: WorkerStallLoop
        expr: increase(radiocheck_worker_stall_restarts_total[30m]) >= 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Worker em stall-loop: {{ $labels.station_id }} ({{ $value }} restarts em 30min)"
          description: |
            Worker reiniciando repetidamente sem conseguir capturar áudio.
            A emissora está efetivamente SEM monitoramento. Causas comuns:
            stream_url morta (404), geo-block (403 Country Not Allowed),
            bloqueio por user-agent/IP, mudança de codec.
          runbook_url: "docs/runbooks/WorkerStallLoop.md"

      # ── AuditRejectedSpike ───────────────────────────────────────────
      # audit_rejected é invisível em todas as telas de usuário — sem este
      # alerta, uma onda de rejeições (evidência desalinhada, threshold
      # descalibrado, fingerprint inconsistente) passa despercebida. No
      # incidente: picos de 15-17% das detecções/dia rejeitadas em silêncio.
      - alert: AuditRejectedSpike
        expr: |
          sum(increase(radiocheck_audit_attempts_total{result="rejected"}[6h]))
            / sum(increase(radiocheck_audit_attempts_total[6h])) > 0.08
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Audit §9.9 rejeitando {{ $value | humanizePercentage }} das detecções (6h)"
          description: |
            Mais de 8% das detecções confirmadas estão sendo rejeitadas pelo
            audit pré-persist e ficando invisíveis nas telas/relatórios.
            Causas: extração de evidência desalinhada, fingerprint do master
            inconsistente com o código (migração incompleta), threshold do
            audit descalibrado pra emissoras ruidosas.
          runbook_url: "docs/runbooks/AuditRejectedSpike.md"

      # ── DedupSuppressedSuspect ───────────────────────────────────────
      # Supressão §18.2.2 em que o corte SUPRIMIDO estava mais confiante que o
      # mantido = assinatura de veiculação real morta por um false-confirm de
      # trecho compartilhado (caso PULSO MILIUM, material <10s contido em spot
      # do mesmo cliente). Antes deste alerta a perda era 100% silenciosa: o
      # suppress não deixa row, só linha em dedup_suppressions.
      - alert: DedupSuppressedSuspect
        expr: |
          increase(radiocheck_match_disambiguation_total{action="suppressed_suspect"}[1h]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Dedup §18.2.2 suprimiu tocada provavelmente REAL"
          description: |
            {{ $value }} supressões na última hora com confiança do suprimido
            >= mantido+0.25 (false-confirm vencendo tocada real — caso PULSO
            MILIUM). Rodar a query B5 do incident-2026-07-24 e conferir se
            DISAMBIG_BY_COVERAGE está ligado (a v2 resgata no pós-audit).
          runbook_url: "docs/runbooks/DedupSuppressedSuspect.md"

      # ── LifecycleSchedulerStuck ──────────────────────────────────────
      # TODO(metrics): expor radiocheck_lifecycle_scheduler_last_run_timestamp
      # no scheduler de campanhas (§18.2.1). Item ficou de fora da
      # implementação 2B; necessário criar gauge atualizada a cada tick
      # (independente de haver transição). Sem ela este alerta nunca
      # dispara — manter ativo para já validar a regra quando a métrica
      # for adicionada.
      - alert: LifecycleSchedulerStuck
        expr: |
          time() - radiocheck_lifecycle_scheduler_last_run_timestamp > 300
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Lifecycle scheduler de campanhas sem rodar há >5min"
          description: |
            Scheduler de transições programada→ativa→concluida não executa
            há mais de 5 minutos. Campanhas podem ficar travadas em estado
            incorreto. Ver §18.2.1 do plano.
          runbook_url: "docs/runbooks/LifecycleSchedulerStuck.md"
