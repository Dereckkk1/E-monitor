services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # WAL archiving (§14.4) is enabled in production via postgresql.conf
      # snippet at infra/postgres/postgresql.conf.snippet — left disabled in
      # local dev to avoid forcing AWS credentials on every contributor.
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pg_archive:/var/lib/postgresql/archive
      - ../../migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["--jetstream", "--http_port", "8222"]
    ports:
      - "${NATS_PORT}:4222"
      - "8222:8222"

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb -p local/${S3_BUCKET} || true;
      "

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfiles/workers.Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_REGION: us-east-1
      MASTERS_PATH: /data/masters
      API_PORT: "8080"
      CLAP_VERIFIER_URL: http://clap-verifier:8080
      # OpenTelemetry tracing (§15.3). Empty endpoint disables tracing
      # cleanly; pointing at jaeger:4317 lights up the Jaeger UI.
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      OTEL_SERVICE_NAME: radiocheck-api
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      RADIOCHECK_ENV: development
    ports:
      - "${API_PORT}:8080"
    volumes:
      - mastersdata:/data/masters
      - ../../audio-refs:/audio-refs:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      minio:
        condition: service_healthy

  radio-sim:
    image: alpine:3.19
    profiles: ["sim"]
    entrypoint: ["/bin/sh", "-c"]
    command: ["apk add --no-cache ffmpeg >/dev/null && exec /sim/simulate.sh"]
    environment:
      QUALITY: ${SIM_QUALITY:-fm-standard}
      PORT: "8000"
      GAP_SECONDS: ${SIM_GAP_SECONDS:-15}
      MASTERS_DIR: /masters
    ports:
      - "${SIM_PORT:-18000}:8000"
    volumes:
      - mastersdata:/masters:ro
      - ../../scripts/radio-sim:/sim:ro

  fingerprint:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfiles/fingerprint.Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NATS_URL: nats://nats:4222
      MASTERS_PATH: /data/masters
    volumes:
      - mastersdata:/data/masters
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started

  # ── Fase 2: neural verifier sidecar (CLAP) ────────────────────────────────
  clap-verifier:
    build:
      context: ../../clap-verifier
    environment:
      - MOCK_MODE=true
    ports:
      - "8081:8080"
    volumes:
      - clap-models:/models

  # ── Fase 2: observabilidade (Prometheus + Grafana + Alertmanager) ────────
  prometheus:
    image: prom/prometheus:v2.52.0
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-lifecycle"

  grafana:
    image: grafana/grafana:10.4.2
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - ../grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ../grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ../alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"

  # ── Fase 2: distributed tracing (§15.3) ──────────────────────────────────
  # Jaeger all-in-one (collector + query + UI in a single container). The
  # workers point OTEL_EXPORTER_OTLP_ENDPOINT at jaeger:4317 (OTLP gRPC).
  # The UI is exposed on http://localhost:16686.
  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "4317:4317"   # OTLP gRPC ingest
      - "4318:4318"   # OTLP HTTP ingest (kept enabled for libraries that
                      # only speak HTTP, e.g. browser-based agents).
      - "16686:16686" # Jaeger UI

  # ── Fase 2: backup diario do PG ──────────────────────────────────────────
  backup:
    image: postgres:16-alpine
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable}"
      BACKUP_DIR: /backup
    volumes:
      - backup-data:/backup
      - ../scripts/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "-c", "while true; do sleep 86400; sh /backup.sh; done"]
    depends_on:
      - postgres

volumes:
  pgdata:
  pg_archive:
  miniodata:
  mastersdata:
  clap-models:
  grafana-data:
  backup-data:
